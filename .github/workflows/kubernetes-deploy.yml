name: Kubernetes Manifest Validation

on:
  pull_request:
    paths:
      - 'kubernetes/**'
      - '.github/workflows/kubernetes-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'kubernetes/**'
      - '.github/workflows/kubernetes-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate manifest YAML structure
        run: |
          set -euo pipefail
          for manifest in kubernetes/namespace.yaml kubernetes/deployment.yaml kubernetes/service.yaml; do
            test -s "$manifest"
            kubectl apply --dry-run=client --validate=false -f "$manifest"
          done

      - name: Show manifests being validated
        run: |
          echo "Validated Kubernetes manifests without deploying to a cluster."
          echo "A real deployment requires a configured Kubernetes context and credentials."
