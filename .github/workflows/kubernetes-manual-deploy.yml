name: Kubernetes Manual Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type deploy to confirm deployment to the configured cluster"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kubernetes-manual-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to configured Kubernetes cluster
    if: ${{ inputs.confirm_deploy == 'deploy' }}
    runs-on: ubuntu-latest
    environment: kubernetes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig from GitHub secret
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_DATA:-}" ]; then
            echo "::error::Add a base64-encoded kubeconfig as the KUBE_CONFIG_DATA secret in the kubernetes environment."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      - name: Validate manifests against cluster
        run: |
          kubectl apply --dry-run=server -f kubernetes/namespace.yaml
          kubectl apply --dry-run=server -f kubernetes/deployment.yaml
          kubectl apply --dry-run=server -f kubernetes/service.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/dockerized-app -n docker-app --timeout=180s

      - name: Show deployment status
        if: always()
        run: |
          kubectl get deployment,pods,service -n docker-app || true

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
