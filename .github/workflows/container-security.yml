name: Container Security

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'app/**'
      - '.github/workflows/container-security.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'app/**'
      - '.github/workflows/container-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-image:
    name: Build, scan, and generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: portfolio-app:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: portfolio-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.5
        with:
          image: portfolio-app:${{ github.sha }}
          artifact-name: portfolio-app-sbom.spdx.json
          output-file: ./portfolio-app-sbom.spdx.json
          format: spdx-json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-app-sbom
          path: ./portfolio-app-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14
